version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-scribe-postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD:-postgres}
      POSTGRES_DB: ${TYPEORM_DATABASE:-ai-scribe}
    ports:
      - "${TYPEORM_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-scribe-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai-scribe" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-scribe-api
    restart: always
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-scribe-network

volumes:
  postgres_data:


networks:
  ai-scribe-network:
    driver: bridge
